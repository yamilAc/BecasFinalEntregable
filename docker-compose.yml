services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en el entorno de despliegue}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sistema_becas}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 5000
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE:-sistema_becas}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE: ${JWT_EXPIRE:-7d}
    ports:
      - "5000:5000"
    volumes:
      - uploads_data:/app/uploads  # ✅ Este volumen debe existir
    command: ["node", "server.js"]

  client:
    build: ./client
    restart: always
    depends_on:
      - backend
    environment:
      - REACT_APP_API_URL=http://backend:5000
      - VITE_API_URL=http://backend:5000
    ports:
      - "3000:80"

# ✅ DEFINIR LOS VOLÚMENES AQUÍ
volumes:
  db_data:
  uploads_data:  # ✅ AGREGAR ESTE VOLUMEN
